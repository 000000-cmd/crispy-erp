
    <div class="space-y-6">
      <div class="space-y-1">
        <span class="inline-flex items-center gap-1 rounded-full bg-surface-muted px-2 py-0.5 text-[11px] font-medium text-text-muted">
          Panel de administración
        </span>
        <h1 class="text-2xl font-semibold text-text">Acceso administradores</h1>
        <p class="text-sm text-text-muted">Ingresa con tu cuenta de administrador del sistema.</p>
      </div>

      <app-dynamic-form
        [schema]="schema"
        [submitting]="loading()"
        (submitValue)="onSubmit($event)"
      />

      @if (error()) {
        <p class="text-sm text-rose-600">{{ error() }}</p>
      }

      <div class="pt-2 border-t border-border text-sm">
        <a routerLink="/login" class="text-text-muted hover:text-text">← Volver al acceso de negocios</a>
      </div>
    </div>
