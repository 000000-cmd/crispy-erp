<div class="space-y-5">

  <header class="flex items-end justify-between gap-3">

    <div>
      <h1 class="text-xl font-semibold text-text">
        {{ 'admin.thirdParties' | t }}
      </h1>

      <p class="text-sm text-text-muted">
        {{ 'admin.thirdParties.subtitle' | t }}
      </p>
    </div>

    <app-button
      [icon]="plusIcon"
      (onClick)="openCreate()">

      {{ 'admin.thirdParties.new' | t }}

    </app-button>

  </header>

  <app-data-table
    [columns]="columns()"
    [rows]="thirdParties()"
    [actions]="actions()"
    [loading]="loading()"
  />

  <app-drawer
    [open]="!!editing()"
    [title]="editing()?.id
      ? ('admin.thirdParties.edit' | t)
      : ('admin.thirdParties.new' | t)"
    size="lg"
    [showActions]="true"
    [dirty]="dirty()"
    [saving]="saving()"
    (save)="submitForm()"
    (onClose)="close()">

    @if (schema()) {

      <app-dynamic-form
        #dynForm
        [schema]="schema()!"
        [model]="editing()!"
        [submitting]="saving()"
        (submitValue)="onSubmit($event)"
        (dirtyChange)="dirty.set($event)"
      />

    }

  </app-drawer>

</div>
