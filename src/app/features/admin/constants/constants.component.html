
    <div class="space-y-5">
      <app-page-header [title]="'admin.constants' | t" [subtitle]="'admin.constants.subtitle' | t">
        <app-button [icon]="plusIcon" (onClick)="open(null)">{{ 'admin.constants.new' | t }}</app-button>
      </app-page-header>

      <app-data-table [columns]="columns()" [rows]="items()" [actions]="actions()" [loading]="loading()" />

      <app-drawer
        [open]="!!editing()"
        [title]="editing()?.id ? ('admin.constants.edit' | t) : ('admin.constants.new' | t)"
        size="md"
        [showActions]="true"
        [dirty]="dirty()"
        [saving]="saving()"
        (save)="submitForm()"
        (onClose)="close()"
      >
        @if (editing()) {
          <app-dynamic-form
            #dynForm
            [schema]="schema"
            [model]="editing()!"
            [submitting]="saving()"
            (submitValue)="onSubmit($event)"
            (dirtyChange)="dirty.set($event)"
          />
        }
      </app-drawer>
    </div>
