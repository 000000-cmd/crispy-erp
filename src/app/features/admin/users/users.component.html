
    <div class="space-y-5">
      <header class="flex items-end justify-between gap-3">
        <div>
          <h1 class="text-xl font-semibold text-text">{{ 'admin.users' | t }}</h1>
          <p class="text-sm text-text-muted">{{ 'admin.users.subtitle' | t }}</p>
        </div>
        <app-button [icon]="plusIcon" (onClick)="openCreate()">{{ 'admin.users.new' | t }}</app-button>
      </header>

      <app-data-table
        [columns]="columns()"
        [rows]="users()"
        [actions]="actions()"
        [loading]="loading()"
      />

      <app-drawer
        [open]="!!editing()"
        [title]="editing()?.id ? ('admin.users.edit' | t) : ('admin.users.new' | t)"
        size="lg"
        [showActions]="true"
        [dirty]="dirty()"
        [saving]="saving()"
        (save)="submitForm()"
        (onClose)="close()"
      >
        @if (schema()) {
          <app-dynamic-form
            #dynForm
            [schema]="schema()!"
            [model]="editing()!"
            [submitting]="saving()"
            (submitValue)="onSubmit($event)"
            (dirtyChange)="dirty.set($event)"
          />
        }
      </app-drawer>
    </div>
