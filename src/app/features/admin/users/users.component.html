
    <div class="space-y-5">
      <app-page-header [title]="'admin.users' | t" [subtitle]="'admin.users.subtitle' | t">
        <app-button [icon]="plusIcon" (onClick)="openCreate()">{{ 'admin.users.new' | t }}</app-button>
      </app-page-header>

      <app-data-table
        [columns]="columns()"
        [rows]="users()"
        [actions]="actions()"
        [loading]="loading()"
      />

      <app-drawer
        [open]="!!editing()"
        [title]="editing()?.id ? ('admin.users.edit' | t) : ('admin.users.new' | t)"
        size="lg"
        [showActions]="true"
        [dirty]="dirty()"
        [saving]="saving()"
        (save)="submitForm()"
        (onClose)="close()"
      >
        @if (schema()) {
          <app-dynamic-form
            #dynForm
            [schema]="schema()!"
            [model]="editing()!"
            [submitting]="saving()"
            (submitValue)="onSubmit($event)"
            (dirtyChange)="dirty.set($event)"
          />
        }
      </app-drawer>
    </div>
