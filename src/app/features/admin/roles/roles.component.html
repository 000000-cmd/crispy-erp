
    <div class="space-y-5">
      <app-page-header [title]="'admin.roles' | t" [subtitle]="'admin.roles.subtitle' | t">
        <app-button [icon]="plusIcon" (onClick)="open(null)">{{ 'admin.roles.new' | t }}</app-button>
      </app-page-header>

      <app-data-table [columns]="columns()" [rows]="items()" [actions]="actions()" [loading]="loading()" />

      <!-- Edit/create drawer -->
      <app-drawer
        [open]="!!editing()"
        [title]="editing()?.id ? ('admin.roles.edit' | t) : ('admin.roles.new' | t)"
        size="md"
        [showActions]="true"
        [dirty]="dirty()"
        [saving]="saving()"
        (save)="submitForm()"
        (onClose)="close()"
      >
        @if (editing()) {
          <app-dynamic-form
            #dynForm
            [schema]="schema"
            [model]="editing()!"
            [submitting]="saving()"
            (submitValue)="onSubmit($event)"
            (dirtyChange)="dirty.set($event)"
          />
        }
      </app-drawer>

      <!-- Permissions assignment modal -->
      <app-drawer [open]="!!permsFor()" [title]="'admin.roles.permissions.title' | t : { name: permsFor()?.name ?? '' }" size="lg" (onClose)="closePerms()">
        @if (permsFor()) {
          @if (loadingPerms()) {
            <div class="py-10 text-center"><app-spinner [size]="24" /></div>
          } @else {
            <div class="space-y-3">
              <p class="text-xs text-text-muted">{{ 'admin.roles.permissions.hint' | t }}</p>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-96 overflow-y-auto pr-1">
                @for (p of allPerms(); track p.id) {
                  <label class="flex items-start gap-2 p-2.5 rounded-md border border-border hover:bg-surface-hover cursor-pointer">
                    <span class="mt-0.5">
                      <app-checkbox
                        [checked]="selected().has(p.id)"
                        (checkedChange)="toggle(p.id, $event)"
                      />
                    </span>
                    <span class="min-w-0">
                      <span class="block text-sm font-medium text-text">{{ p.name }}</span>
                      <span class="block text-caption text-text-muted font-mono">{{ p.code }}</span>
                      @if (p.description) {
                        <span class="block text-caption text-text-muted mt-0.5 line-clamp-2">{{ p.description }}</span>
                      }
                    </span>
                  </label>
                }
              </div>
            </div>
          }
        }
        @if (permsFor()) {
          <div drawerFooter class="px-5 py-3 border-t border-border flex justify-end gap-2 bg-surface-muted">
            <app-button variant="ghost" (onClick)="closePerms()">{{ 'common.cancel' | t }}</app-button>
            <app-button [loading]="savingPerms()" (onClick)="savePerms()">{{ 'admin.roles.permissions.save' | t }}</app-button>
          </div>
        }
      </app-drawer>
    </div>
