<div class="space-y-5">
  <header class="flex items-end justify-between gap-3">
    <div>
      <h1 class="text-xl font-semibold text-text">Sedes</h1>
      <p class="text-sm text-text-muted">Las ubicaciones físicas de tu negocio.</p>
    </div>
    @if (businessId()) {
      <app-button [icon]="plusIcon" (onClick)="openCreate()">Nueva sede</app-button>
    }
  </header>

  @if (loading()) {
    <p class="text-sm text-text-muted">Cargando…</p>
  } @else if (!businessId()) {
    <div class="rounded-2xl border border-border bg-surface p-6 space-y-3">
      <h2 class="text-base font-semibold text-text">Primero registra tu negocio</h2>
      <p class="text-sm text-text-muted">Necesitas una empresa para gestionar sedes.</p>
      <a routerLink="/tenant/onboarding"><app-button>Crear mi negocio</app-button></a>
    </div>
  } @else {
    <app-data-table [columns]="columns()" [rows]="items()" [actions]="actions()" [loading]="loading()" />
  }

  <app-drawer
    [open]="open()"
    [title]="editingId() ? 'Editar sede' : 'Nueva sede'"
    size="lg"
    [showActions]="true"
    [dirty]="formValid()"
    [saving]="saving()"
    (save)="save()"
    (onClose)="close()">

    <div class="space-y-4">
      <app-field label="Tipo de sede" [required]="true">
        <app-autocomplete
          [options]="branchTypeOptions()"
          [ngModel]="form().branchTypeId"
          (ngModelChange)="patch('branchTypeId', $event)"
          placeholder="Selecciona el tipo" />
      </app-field>

      <div class="grid grid-cols-2 gap-3">
        <app-field label="Nombre" [required]="true">
          <app-input [value]="form().name" (valueChange)="patch('name', $event)" placeholder="Sede centro" />
        </app-field>
        <app-field label="Código">
          <app-input [value]="form().code" (valueChange)="patch('code', $event)" placeholder="Opcional" />
        </app-field>
      </div>

      <app-field label="Ubicación" [required]="true"
                 hint="Elige país, departamento y municipio. El barrio es opcional.">
        <app-location-picker (change)="onLocation($event)" />
      </app-field>

      <app-field label="Dirección">
        <app-input [value]="form().addressLine" (valueChange)="patch('addressLine', $event)" placeholder="Calle 1 # 2-3" />
      </app-field>

      <div class="grid grid-cols-2 gap-3">
        <app-field label="Teléfono">
          <app-input type="tel" [value]="form().phone" (valueChange)="patch('phone', $event)" placeholder="3001234567" />
        </app-field>
        <app-field label="Principal">
          <label class="inline-flex items-center gap-2 h-9">
            <app-switch [checked]="form().isMain" (checkedChange)="patch('isMain', $event)" />
            <span class="text-sm text-text-muted">Es la sede principal</span>
          </label>
        </app-field>
      </div>
    </div>
  </app-drawer>
</div>
