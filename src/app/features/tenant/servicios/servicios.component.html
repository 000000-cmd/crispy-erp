<div class="space-y-5">
  <app-page-header title="Servicios" subtitle="Lo que ofrece tu negocio: cortes, tratamientos y más.">
    @if (businessId()) {
      <app-button [icon]="plusIcon" (onClick)="openCreate()">Nuevo servicio</app-button>
    }
  </app-page-header>

  @if (loading()) {
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
      <app-skeleton variant="block" height="10rem" />
      <app-skeleton variant="block" height="10rem" />
      <app-skeleton variant="block" height="10rem" />
    </div>
  } @else {
    @if (!items().length) {
      <app-form-companion [message]="'companion.servicio' | t" />
    } @else {
      <!-- Carta de precios: cards con el precio como protagonista -->
      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
        @for (o of items(); track o.id) {
          <article
            class="group relative overflow-hidden rounded-2xl border border-border bg-surface p-5 transition-all hover:-translate-y-0.5 hover:shadow-lg hover:border-primary-300 dark:hover:border-primary-700"
            [class.opacity-60]="!o.isActive">
            <!-- acento superior con el color del tema -->
            <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-primary-500 via-primary-400 to-primary-600"
                 [class.opacity-30]="!o.isActive"></div>

            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <h3 class="font-semibold text-text truncate">{{ o.name }}</h3>
                @if (o.description) {
                  <p class="text-xs text-text-muted mt-0.5 line-clamp-2">{{ o.description }}</p>
                }
              </div>

              <!-- interruptor de activo directo en la card -->
              <button
                type="button"
                (click)="toggleActive(o)"
                [attr.aria-label]="o.isActive ? 'Desactivar ' + o.name : 'Activar ' + o.name"
                [attr.aria-pressed]="o.isActive"
                class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full transition-colors"
                [class.bg-primary-500]="o.isActive"
                [class.bg-surface-muted]="!o.isActive"
                [class.border]="!o.isActive"
                [class.border-border]="!o.isActive">
                <span class="inline-block h-3.5 w-3.5 rounded-full bg-white shadow transition-transform"
                      [class.translate-x-[1.15rem]]="o.isActive"
                      [class.translate-x-0.5]="!o.isActive"></span>
              </button>
            </div>

            <div class="mt-4 flex items-end justify-between gap-2">
              <p class="text-2xl font-bold tracking-tight text-text tabular-nums">{{ fmt(o.price) }}</p>
              <span class="inline-flex items-center gap-1 rounded-full bg-primary-500/10 text-primary-600 dark:text-primary-300 px-2.5 py-1 text-xs font-medium">
                <lucide-icon [img]="clockIcon" [size]="12" /> {{ o.durationMinutes }} min
              </span>
            </div>

            <!-- acciones al hover (siempre accesibles por teclado) -->
            <div class="mt-4 flex gap-2 opacity-0 transition-opacity group-hover:opacity-100 focus-within:opacity-100">
              <button type="button" (click)="openEdit(o)"
                      class="inline-flex items-center gap-1.5 rounded-lg border border-border px-3 py-1.5 text-xs font-medium text-text hover:bg-surface-muted transition">
                <lucide-icon [img]="pencilIcon" [size]="13" /> Editar
              </button>
              <button type="button" (click)="askDelete(o)"
                      class="inline-flex items-center gap-1.5 rounded-lg border border-rose-200 dark:border-rose-900 px-3 py-1.5 text-xs font-medium text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition">
                <lucide-icon [img]="trashIcon" [size]="13" /> Eliminar
              </button>
            </div>
          </article>
        }
      </div>
    }
  }

  <app-drawer
    [open]="!!editing()"
    [title]="editing()?.id ? 'Editar servicio' : 'Nuevo servicio'"
    size="md"
    [showActions]="true"
    [dirty]="dirty()"
    [saving]="saving()"
    (save)="submitForm()"
    (onClose)="close()">
    @if (editing()) {
      <app-dynamic-form
        #dynForm
        [schema]="schema"
        [model]="editing()!"
        [submitting]="saving()"
        (submitValue)="onSubmit($event)"
        (dirtyChange)="dirty.set($event)" />
    }
  </app-drawer>
</div>
