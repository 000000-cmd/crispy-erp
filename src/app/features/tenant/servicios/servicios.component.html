<div class="space-y-5">
  <app-page-header title="Servicios" subtitle="Lo que ofrece tu negocio: cortes, tratamientos y más.">
    @if (businessId()) {
      <app-button [icon]="plusIcon" (onClick)="openCreate()">Nuevo servicio</app-button>
    }
  </app-page-header>

  @if (loading()) {
    <app-skeleton [lines]="4" />
  } @else if (!businessId()) {
    <div class="rounded-2xl border border-border bg-surface p-6 space-y-3">
      <h2 class="text-base font-semibold text-text">Primero registra tu negocio</h2>
      <p class="text-sm text-text-muted">Necesitas una empresa para gestionar servicios.</p>
      <a routerLink="/tenant/onboarding"><app-button>Crear mi negocio</app-button></a>
    </div>
  } @else {
    @if (!items().length) {
      <app-form-companion [message]="'companion.servicio' | t" />
    }
    <app-data-table [columns]="columns()" [rows]="items()" [actions]="actions()" [loading]="loading()" />
  }

  <app-drawer
    [open]="!!editing()"
    [title]="editing()?.id ? 'Editar servicio' : 'Nuevo servicio'"
    size="md"
    [showActions]="true"
    [dirty]="dirty()"
    [saving]="saving()"
    (save)="submitForm()"
    (onClose)="close()">
    @if (editing()) {
      <app-dynamic-form
        #dynForm
        [schema]="schema"
        [model]="editing()!"
        [submitting]="saving()"
        (submitValue)="onSubmit($event)"
        (dirtyChange)="dirty.set($event)" />
    }
  </app-drawer>
</div>
