
    <button
      type="button"
      role="switch"
      [attr.aria-checked]="isDark()"
      [attr.aria-label]="(isDark() ? 'common.theme.light' : 'common.theme.dark') | t"
      [title]="(isDark() ? 'common.theme.light' : 'common.theme.dark') | t"
      (click)="theme.toggleMode()"
      class="relative h-7 w-12 rounded-full border border-border
             transition-colors duration-200 cursor-pointer
             hover:border-border-strong
             focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500/40"
      [class.bg-surface-muted]="!isDark()"
      [class.bg-primary-500]="isDark()"
    >
      <!-- Iconos de fondo -->
      <span
        class="absolute left-1 top-1/2 -translate-y-1/2 transition-opacity duration-200"
        [class.opacity-100]="!isDark()"
        [class.opacity-30]="isDark()"
      >
        <lucide-icon [img]="sunIcon" [size]="11" class="text-amber-500"></lucide-icon>
      </span>
      <span
        class="absolute right-1 top-1/2 -translate-y-1/2 transition-opacity duration-200"
        [class.opacity-100]="isDark()"
        [class.opacity-30]="!isDark()"
      >
        <lucide-icon [img]="moonIcon" [size]="11" class="text-white"></lucide-icon>
      </span>

      <!-- Perilla deslizante -->
      <span
        class="absolute top-0.5 h-5 w-5 rounded-full bg-surface shadow
               transition-all duration-200 ease-out
               flex items-center justify-center"
        [class.left-0.5]="!isDark()"
        [class.left-[1.625rem]]="isDark()"
      >
        <lucide-icon
          [img]="isDark() ? moonIcon : sunIcon"
          [size]="11"
          [class.text-amber-500]="!isDark()"
          [class.text-primary-700]="isDark()"
        ></lucide-icon>
      </span>
    </button>
