
    <div
      role="radiogroup"
      aria-label="Idioma"
      class="inline-flex items-center rounded-md border border-border bg-surface p-0.5
             transition-colors hover:border-border-strong"
    >
      @for (l of locales; track l) {
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="i18n.locale() === l"
          [class]="btnClass(i18n.locale() === l)"
          (click)="set(l)"
        >
          {{ l.toUpperCase() }}
        </button>
      }
    </div>
