
    <div class="flex flex-wrap gap-x-5 gap-y-2 py-1">
      @for (o of options(); track o.value) {
        <label class="inline-flex items-center gap-2 text-sm cursor-pointer">
          <input
            type="radio"
            [name]="field().key"
            [value]="o.value"
            [checked]="ctrl().value === o.value"
            (change)="ctrl().setValue(o.value); ctrl().markAsDirty(); ctrl().markAsTouched()"
            [disabled]="o.disabled || false"
            class="accent-primary-500"
          />
          <span>{{ o.label }}</span>
        </label>
      }
    </div>
    @if (showError()) {
      <p class="text-caption text-rose-600 mt-1">{{ errorMsg().key | t : errorMsg().params }}</p>
    } @else if (hint()) {
      <p class="text-caption text-text-muted mt-1">{{ hint() }}</p>
    }
