
<app-autocomplete
  [formControl]="fc()"
  [options]="options()"
  [searchFn]="field().searchOptions ?? null"
  [placeholder]="field().placeholder || 'Buscar…'"
  [invalid]="showError()"
  [minSearchChars]="field().minSearchChars ?? 0"
  [debounceMs]="field().debounceMs ?? 250"
/>

@if (showError()) {
  <p class="text-[11px] text-rose-600 mt-1">{{ errorMsg().key | t : errorMsg().params }}</p>
} @else if (hint()) {
  <p class="text-[11px] text-text-muted mt-1">{{ hint() }}</p>
}
