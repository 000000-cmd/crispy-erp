<div class="relative">
  <span class="pointer-events-none absolute inset-y-0 left-3 grid place-items-center text-sm text-text-muted select-none">$</span>
  <input
    type="text"
    inputmode="numeric"
    autocomplete="off"
    [value]="masked()"
    [placeholder]="field().placeholder || '0'"
    [readonly]="field().readonly || false"
    (input)="onInput($any($event.target))"
    (blur)="onBlur()"
    [class]="inputClass()"
  />
  <app-field-status [state]="state()" class="pointer-events-none absolute inset-y-0 right-2.5 grid place-items-center" />
</div>
@if (showError()) {
  <p class="text-caption text-rose-600 mt-1">{{ errorMsg().key | t : errorMsg().params }}</p>
} @else if (hint()) {
  <p class="text-caption text-text-muted mt-1">{{ hint() }}</p>
}
