
    <div
      #portal
      class="fixed inset-0 z-[200]"
      [class.pointer-events-none]="!open()"
      aria-hidden="false"
    >
      <!-- Backdrop -->
      <div
        class="app-drawer-backdrop absolute inset-0 bg-black/40 backdrop-blur-[2px]"
        [class.opacity-100]="open()"
        [class.opacity-0]="!open()"
        (click)="requestClose('backdrop')"
      ></div>

      <aside
        role="dialog"
        aria-modal="true"
        class="app-drawer-panel absolute top-0 right-0 h-full bg-surface border-l border-border shadow-2xl
               flex flex-col will-change-transform"
        [class]="sizeClass()"
        [class.translate-x-0]="open()"
        [class.translate-x-full]="!open()"
      >
        @if (title()) {
          <header class="px-5 py-4 border-b border-border flex items-center justify-between shrink-0">
            <h3 class="text-base font-semibold text-text">{{ title() }}</h3>
            <button
              type="button"
              class="h-8 w-8 inline-flex items-center justify-center rounded-md text-text-soft
                     hover:text-text hover:bg-surface-hover transition-colors cursor-pointer"
              (click)="requestClose('button')"
              aria-label="Cerrar"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </header>
        }

        <div class="px-5 py-4 overflow-auto flex-1">
          <ng-content />
        </div>

        @if (hasFooterSlot) {
          <ng-content select="[drawerFooter]" />
        } @else if (showActions()) {
          <footer class="px-5 py-3 border-t border-border bg-surface-muted/40 flex items-center justify-start gap-2 shrink-0">
            <app-button
              variant="secondary"
              [disabled]="saving()"
              (onClick)="requestClose('button')"
            >
              {{ cancelLabel() | t }}
            </app-button>
            <app-button
              variant="primary"
              [loading]="saving()"
              (onClick)="onSaveClick()"
            >
              {{ saveLabel() | t }}
            </app-button>
          </footer>
        }
      </aside>
    </div>
