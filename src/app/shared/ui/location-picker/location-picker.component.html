
<div class="space-y-3">

  @if (mode() === 'search') {
    <!-- Municipio primero: país y departamento se derivan del resultado. -->
    <div>
      <label class="block text-caption font-medium text-text-muted mb-1">{{ labels().municipality }}</label>
      <app-autocomplete
        [searchFn]="municipalitiesFn()"
        [minSearchChars]="3"
        [placeholder]="'Busca tu municipio…'"
        hintText="Escribe al menos 3 letras. El departamento y el país se completan solos."
        (selected)="onMunicipalitySearch($event)"
      />
      @if (derivedContext(); as ctx) {
        <p class="mt-1 text-caption text-text-muted">{{ ctx }}</p>
      }
    </div>

    @if (askNeighborhood() && municipality()) {
      <div>
        <label class="block text-caption font-medium text-text-muted mb-1">{{ labels().neighborhood }}</label>
        <app-autocomplete
          [searchFn]="neighborhoodsFn()"
          [minSearchChars]="3"
          [placeholder]="'Buscar barrio o vereda… (opcional)'"
          hintText="Opcional"
          (selected)="onNeighborhood($event)"
        />
      </div>
    }
  } @else {
    <!-- Cascada jerárquica (apilada en columna). -->
    @if (show().country) {
      <div>
        <label class="block text-caption font-medium text-text-muted mb-1">{{ labels().country }}</label>
        <app-autocomplete
          [searchFn]="countriesFn()"
          [minSearchChars]="3"
          [placeholder]="'Buscar país…'"
          hintText="Escribe al menos 3 letras"
          (selected)="onCountry($event)"
        />
      </div>
    }

    @if (show().department) {
      <div>
        <label class="block text-caption font-medium text-text-muted mb-1">{{ labels().department }}</label>
        <app-autocomplete
          [searchFn]="departmentsFn()"
          [minSearchChars]="3"
          [placeholder]="'Buscar departamento…'"
          hintText="Escribe al menos 3 letras"
          (selected)="onDepartment($event)"
        />
      </div>
    }

    @if (show().municipality) {
      <div>
        <label class="block text-caption font-medium text-text-muted mb-1">{{ labels().municipality }}</label>
        <app-autocomplete
          [searchFn]="municipalitiesFn()"
          [minSearchChars]="3"
          [placeholder]="'Buscar municipio…'"
          hintText="Escribe al menos 3 letras"
          (selected)="onMunicipality($event)"
        />
      </div>
    }

    @if (show().neighborhood) {
      <div>
        <label class="block text-caption font-medium text-text-muted mb-1">{{ labels().neighborhood }}</label>
        <app-autocomplete
          [searchFn]="neighborhoodsFn()"
          [minSearchChars]="3"
          [placeholder]="'Buscar barrio o vereda…'"
          hintText="Escribe al menos 3 letras"
          (selected)="onNeighborhood($event)"
        />
      </div>
    }
  }
</div>
