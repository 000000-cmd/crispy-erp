
    <div class="flex items-center gap-1 border-b border-border">
      @for (t of tabs(); track t.id) {
        <button
          type="button"
          class="app-tab-btn relative px-3 py-2 text-sm"
          [class.text-primary-600]="active() === t.id"
          [class.text-text-muted]="active() !== t.id"
          [class.hover:text-text]="active() !== t.id"
          (click)="active.set(t.id)"
        >
          {{ t.label }}
          <span
            class="app-tab-indicator absolute left-2 right-2 -bottom-px h-0.5 bg-primary-500 rounded-full"
            [class.is-active]="active() === t.id"
            aria-hidden="true"
          ></span>
        </button>
      }
    </div>
