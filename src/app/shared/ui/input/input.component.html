<div class="flex items-center rounded-md border bg-surface transition focus-within:ring-2"
     [class]="boxClasses()"
     [class.opacity-50]="disabled()">
  <input
    [type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [attr.autocomplete]="autocomplete()"
    (input)="onInput($any($event.target).value)"
    (blur)="touched()"
    class="w-full h-9 bg-transparent px-3 text-sm text-text placeholder:text-text-muted focus:outline-none disabled:cursor-not-allowed" />
  @if (suffix()) {
    <span class="pl-1 pr-3 text-sm text-text-muted whitespace-nowrap select-none">{{ suffix() }}</span>
  }
</div>
