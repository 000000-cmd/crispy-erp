<div class="relative">
  <lucide-icon [img]="searchIcon" [size]="16"
    class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-text-muted" />
  <input
    type="text"
    [value]="value()"
    (input)="onInput($any($event.target).value)"
    [placeholder]="placeholder()"
    class="w-full h-9 rounded-md border border-border bg-surface pl-10 pr-3 text-sm text-text
           placeholder:text-text-muted transition
           focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/30" />
</div>
