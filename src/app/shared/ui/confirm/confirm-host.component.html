
    <app-modal [open]="!!confirm.pending()" [title]="confirm.pending()?.title || ('common.confirm' | t)" size="sm" (onClose)="confirm.resolve(false)">
      <p class="text-sm text-text-muted">{{ confirm.pending()?.message }}</p>
      <div modalFooter class="px-5 py-3 border-t border-border flex justify-end gap-2 bg-surface-muted">
        <app-button variant="ghost" (onClick)="confirm.resolve(false)">{{ confirm.pending()?.cancelText || ('common.cancel' | t) }}</app-button>
        <app-button [variant]="confirm.pending()?.tone === 'danger' ? 'danger' : 'primary'" (onClick)="confirm.resolve(true)">
          {{ confirm.pending()?.confirmText || ('common.confirm' | t) }}
        </app-button>
      </div>
    </app-modal>
