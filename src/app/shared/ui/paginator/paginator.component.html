@if (totalPages() > 0) {
  <div class="flex items-center justify-between gap-3 rounded-lg border border-border bg-surface px-4 py-2.5 text-sm text-text-muted">
    <span>{{ totalHits() }} resultados</span>
    <div class="flex items-center gap-2">
      <button type="button" (click)="prev()" [disabled]="!canPrev()"
        class="inline-flex items-center justify-center h-8 w-8 rounded-md border border-border disabled:opacity-40 hover:bg-surface-muted">
        <lucide-icon [img]="prevIcon" [size]="16" />
      </button>
      <span class="tabular-nums">Página {{ page() + 1 }} de {{ totalPages() }}</span>
      <button type="button" (click)="next()" [disabled]="!canNext()"
        class="inline-flex items-center justify-center h-8 w-8 rounded-md border border-border disabled:opacity-40 hover:bg-surface-muted">
        <lucide-icon [img]="nextIcon" [size]="16" />
      </button>
    </div>
  </div>
}
