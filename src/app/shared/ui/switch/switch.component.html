
    <button
      type="button"
      role="switch"
      [attr.aria-checked]="checked()"
      [disabled]="disabled()"
      (click)="toggle()"
      class="app-switch relative inline-flex h-5 w-9 shrink-0 items-center rounded-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500/40 disabled:opacity-50 disabled:cursor-not-allowed active:scale-[0.96]"
      [class.bg-primary-500]="checked()"
      [class.bg-border-strong]="!checked()"
    >
      <span
        class="app-switch-thumb inline-block h-4 w-4 rounded-full bg-white shadow-sm"
        [class.translate-x-4]="checked()"
        [class.translate-x-0.5]="!checked()"
      ></span>
    </button>
