<div class="flex flex-col gap-2" role="status" aria-label="Cargando" aria-live="polite">
  @for (row of rows(); track $index; let i = $index; let last = $last) {
    <div
      class="app-skeleton"
      [class]="shapeClass()"
      [style.width]="resolvedWidth(i, last)"
      [style.height]="resolvedHeight()"
      aria-hidden="true"></div>
  }
</div>
