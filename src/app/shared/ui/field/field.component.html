<div class="space-y-1.5">
  @if (label()) {
    <label class="block text-sm font-medium text-text">
      {{ label() }}@if (required()) {<span class="text-rose-500"> *</span>}
    </label>
  }

  <ng-content />

  @if (error()) {
    <p class="text-xs text-rose-500">{{ error() }}</p>
  } @else if (hint()) {
    <p class="text-xs text-text-muted">{{ hint() }}</p>
  }
</div>
