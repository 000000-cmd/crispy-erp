<aside class="h-full relative">

    <div class="w-full h-[77px]  bg-[#13151f] flex items-center justify-center border-b border-gray-300">
        <h1 class="">ERP MODA</h1>
    </div>
    
    <nav class="w-20 h-full  bg-[#13151f] flex flex-col items-center py-6 gap-6" >
        @for (link of links; track $index) {
        <button   (click)="onLinkClick(link)" class="relative w-18 h-12 rounded-xl flex items-center justify-center transition-colors ">
            
            @if(selected() === link.key){
                <div class="z-10 absolute bg-[#232433] w-4 h-3 -top-4.5 left-15 ">
                    <div class='bg-[#13151f]  w-full h-full rounded-br-full'></div>   
                </div>
                <div class="z-10 absolute bg-[#232433] rotate-270 w-4 h-3 top-14 left-15.5 ">
                    <div class='bg-[#13151f]  w-full h-full rounded-br-full'></div>   
                </div>
                <div class=" z-1 absolute -top-1.5  left-0 w-22 h-15 rounded-xl flex items-center justify-center transition-colors   bg-[#232433] "></div>
            }    
            <div class="  z-10 w-13 h-12 rounded-xl flex items-center justify-center transition-colors
                        bg-[#1a1d2e] text-gray-400 hover:text-white"
                        [class.bg-blue-600]="selected() === link.key"
                        [class.text-white]="selected() === link.key">
            <lucide-angular [name]="link.icon"/>
            </div>

        </button>
    
        }

    </nav>

        <!-- SUBMENU FUERA DEL NAV -->
    @if (expandedLink(); as link) {
    <div
        class="
        absolute left-full top-0
        ml-1 w-72 h-full pt-5
        bg-[#232433]
        border-y-2
        border-r-2
        border-[#364153]
        shadow-r-lg rounded-lg
        z-50
        flex flex-col gap-3
        items-center      
        "
    >
        <h1>Hola, childName Section</h1>
        @for (child of link.childrens; track child.key) {
        <button
            class="w-63 text-left px-4 rounded-lg bg-[#1a1d2e] py-2 text-md font-medium hover:bg-blue-500/20"
            (click)="onChildClick(link, child, $event)"
        >
            {{ child.label }}
        </button>
        }
    </div>
    }


</aside>
